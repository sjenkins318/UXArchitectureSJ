<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Template — UX Architecture</title>
  </head>
  <body>
    <div id="app" class="page-template">
      <header class="global-nav">
        <div class="global-nav__bar">
          <div class="global-nav__left">
            <button class="logo-button" type="button" aria-label="Addepar home">
              <img src="/icons/addepar-icon-black.svg" alt="" />
            </button>

            <div class="filter-chips">
              <button class="filter-chip" type="button" disabled>Book of business</button>
              <button class="filter-chip filter-chip--active" type="button">
                Smith family
                <svg class="filter-chip__close" aria-hidden="true"><use href="/assets/apl/icons.svg#xmark"></use></svg>
              </button>
              <button class="filter-chip" type="button" disabled>
                Davis Family
                <svg class="filter-chip__chevron" aria-hidden="true"><use href="/assets/apl/icons.svg#angle-down"></use></svg>
              </button>
              <button class="nav-icon-button" type="button" aria-label="Add filter">
                <svg class="icon" aria-hidden="true"><use href="/assets/apl/icons.svg#plus"></use></svg>
              </button>
            </div>
          </div>

          <div class="global-nav__right">
            <button class="glyph-icon-button" type="button" aria-label="Addison">
              <img src="/icons/addison-avatar.svg" alt="" />
            </button>
            <button class="nav-icon-button" type="button" aria-label="Clients">
              <svg class="icon" aria-hidden="true"><use href="/assets/apl/icons.svg#users"></use></svg>
            </button>
            <button class="nav-icon-button" type="button" aria-label="Reports">
              <svg class="icon" aria-hidden="true"><use href="/assets/apl/icons.svg#chart-bar"></use></svg>
            </button>
            <button class="nav-icon-button" type="button" aria-label="Billing">
              <svg class="icon" aria-hidden="true"><use href="/assets/apl/icons.svg#dollar-sign"></use></svg>
            </button>
            <button class="nav-icon-button" type="button" aria-label="Alerts">
              <svg class="icon" aria-hidden="true"><use href="/assets/apl/icons.svg#triangle-exclamation"></use></svg>
            </button>
            <button class="glyph-icon-button" type="button" aria-label="Addepar Library">
              <img src="/icons/addepar-library.svg" alt="" />
            </button>
            <button class="nav-icon-button" type="button" aria-label="Help">
              <svg class="icon" aria-hidden="true"><use href="/assets/apl/icons.svg#question-circle"></use></svg>
            </button>
            <button class="nav-icon-button" type="button" aria-label="Notifications">
              <svg class="icon" aria-hidden="true"><use href="/assets/apl/icons.svg#bell"></use></svg>
            </button>
            <div class="profile-avatar" title="Ben Adams">BA</div>
          </div>
        </div>

        <div class="firm-name">
          <span class="firm-name__text">Madison Capital</span>
        </div>
      </header>

      <div class="page-container">
        <nav class="left-nav" aria-label="Primary">
          <ul class="left-nav__list">
            <li>
              <a class="left-nav__item left-nav__item--active" href="#overview">
                <svg class="icon" aria-hidden="true"><use href="/assets/apl/icons.svg#house"></use></svg>
                <span>Overview</span>
              </a>
            </li>
            <li>
              <a class="left-nav__item" href="#performance">
                <svg class="icon" aria-hidden="true"><use href="/assets/apl/icons.svg#chart-line"></use></svg>
                <span>Performance</span>
              </a>
            </li>
            <li>
              <a class="left-nav__item" href="#risk">
                <svg class="icon" aria-hidden="true"><use href="/assets/apl/icons.svg#triangle-exclamation"></use></svg>
                <span>Risk</span>
              </a>
            </li>
            <li>
              <a class="left-nav__item" href="#allocation">
                <svg class="icon" aria-hidden="true"><use href="/assets/apl/icons.svg#chart-pie"></use></svg>
                <span>Allocation</span>
              </a>
            </li>
            <li>
              <a class="left-nav__item" href="#cash-flow">
                <svg class="icon" aria-hidden="true"><use href="/assets/apl/icons.svg#money-bill"></use></svg>
                <span>Cash flow</span>
              </a>
            </li>
            <li>
              <a class="left-nav__item" href="#holdings">
                <svg class="icon" aria-hidden="true"><use href="/assets/apl/icons.svg#layer-group"></use></svg>
                <span>Holdings</span>
              </a>
            </li>
            <li>
              <a class="left-nav__item" href="#documents">
                <svg class="icon" aria-hidden="true"><use href="/assets/apl/icons.svg#files"></use></svg>
                <span>Documents</span>
              </a>
            </li>
          </ul>

          <div class="left-nav__divider"></div>

          <ul class="left-nav__list">
            <li class="left-nav__section">
              <button class="left-nav__section-toggle" type="button" aria-expanded="false">
                <svg class="icon" aria-hidden="true"><use href="/assets/apl/icons.svg#globe"></use></svg>
                <span>Resources</span>
                <svg class="icon left-nav__section-chevron" aria-hidden="true"><use href="/assets/apl/icons.svg#angle-down"></use></svg>
              </button>
            </li>
            <li class="left-nav__section">
              <button class="left-nav__section-toggle" type="button" aria-expanded="false">
                <svg class="icon" aria-hidden="true"><use href="/assets/apl/icons.svg#screwdriver-wrench"></use></svg>
                <span>Utilities</span>
                <svg class="icon left-nav__section-chevron" aria-hidden="true"><use href="/assets/apl/icons.svg#angle-down"></use></svg>
              </button>
            </li>
          </ul>
        </nav>

        <div class="page-content">
          <div class="page-header">
            <h1 class="page-header__title">Page title</h1>
          </div>
          <div class="content-container"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
